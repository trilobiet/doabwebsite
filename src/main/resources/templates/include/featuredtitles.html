<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name=”robots” content=”noindex,follow”/>
    <title>DOAB Featured Titles</title>
</head>
<body>

<!--
  Featured Titles (new additions)
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="featured">
  <div id="FeaturedTitles" class="oa-featured-titles" role="region" aria-label="New additions">
    <!-- Splide carousel -->
    <div class="splide oa-carousel"
         aria-label="New additions – book covers"
         data-splide='{"perPage":8,"gap":"1rem","breakpoints":{"1400":{"perPage":7},"1200":{"perPage":6},"1024":{"perPage":5},"820":{"perPage":4},"640":{"perPage":3},"480":{"perPage":2}}}'>
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide"
              th:each="item, iter : ${featuredItems}"
              th:if="${not #strings.isEmpty(item.title)}"
              th:with="subject=${(topSubjects != null and topSubjects.size() > iter.index) ? topSubjects[iter.index] : ''}">
            <a th:href="${item.url+'?locale-attribute='+language}"
              class="bulma-card bulma-is-shadowless oa-carousel__item"
              th:attr="aria-label=${item.title}">
              <div class="bulma-card-image">
                <figure class="bulma-image">
                  <div class="oa-carousel__box"
                       th:classappend="${#strings.isEmpty(item.thumbnailPath)} ? ' is-fallback' : ''">
                    <img class="oa-carousel__img bulma-is-radiusless"
                        loading="lazy" decoding="async" draggable="false"
                        th:src="${#strings.isEmpty(item.thumbnailPath)} ? @{/static-assets/images/missing.png} : @{|${settings.dspace_api}${item.thumbnailPath}|}"
                        th:alt="|${item.title} – cover|"
                        onerror="this.closest('.oa-carousel__box').classList.add('is-fallback'); this.remove();">
                    <div class="oa-cover-fallback"
                         th:text="|${#strings.defaultString(subject,'')} ${#strings.defaultString(item.title,'')}|">
                      Featured title
                    </div>
                  </div>
                  <figcaption class="bulma-is-size-7 oa-carousel__title bulma-mt-2">
                    <strong th:text="${subject}">Subject</strong>
                    <div class="bulma-has-text-weight-normal" th:text="${item.title}">Item title</div>
                  </figcaption>
                </figure>
              </div>
            </a>
          </li>
        </ul>
      </div>

      <div class="splide__arrows bulma-is-flex bulma-is-justify-content-space-between bulma-is-align-items-center bulma-mt-2 oa-carousel__arrows">
        <button class="splide__arrow splide__arrow--prev bulma-button bulma-has-background-inherit oa-carousel__arrow" aria-label="Previous">‹</button>
        <button class="splide__arrow splide__arrow--next bulma-button bulma-has-background-inherit oa-carousel__arrow" aria-label="Next">›</button>
      </div>
    </div>
  </div>
</th:block>

<footer th:fragment="footer">
	<p>2020 trilobiet.nl</p>
</footer>

</body>
</html>
