<!--
  Sponsors
~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="sponsors">
  <section class="bulma-section bulma-py-5 bulma-has-background-tropic-teal-pastel bulma-has-text-ink oa-sponsors">
    <div class="bulma-container">
      <header class="bulma-has-text-centered bulma-mb-5">
        <h2 class="bulma-title bulma-is-2 bulma-mb-4 bulma-has-text-weight-bold bulma-has-text-ink" th:text="#{doab_is_sponsored_by}">
          DOAB is proudly sponsored by
        </h2>
        <p class="bulma-is-block bulma-is-size-5 bulma-mb-2 bulma-has-text-weight-normal">
          Partners supporting open access books worldwide.
        </p>
      </header>

      <div class="bulma-columns bulma-is-variable bulma-is-4 bulma-is-multiline bulma-m-0 bulma-is-justify-content-flex-start">
        <section class="bulma-column bulma-is-3-desktop bulma-is-6-tablet bulma-is-12-mobile">
          <p class="oa-sponsors__tier-label bulma-is-uppercase bulma-has-text-weight-semibold bulma-is-size-7 bulma-mb-3 bulma-has-text-left">Gold</p>
          <a class="oa-logo-link" href="https://taylorandfrancis.com/books/" target="_blank" rel="noopener" aria-label="Taylor and Francis">
            <figure class="bulma-image oa-logo-box bulma-m-0">
              <img src="https://doabooks.o172i.upcloudobjects.com/uploads/T_and_F_Logo_V3_44b382271b.png" alt="Taylor and Francis" loading="lazy" decoding="async"/>
            </figure>
          </a>
        </section>

        <section class="bulma-column bulma-is-3-desktop bulma-is-6-tablet bulma-is-12-mobile">
          <p class="oa-sponsors__tier-label bulma-is-uppercase bulma-has-text-weight-semibold bulma-is-size-7 bulma-mb-3 bulma-has-text-left">Silver</p>
          <a class="oa-logo-link" href="https://www.springer.com/gp/open-access/books/" target="_blank" rel="noopener" aria-label="Springer Nature">
            <figure class="bulma-image oa-logo-box bulma-m-0">
              <img src="https://doabooks.o172i.upcloudobjects.com/uploads/SN_logosmall_ab4589b9e7.jpg" alt="Springer Nature" loading="lazy" decoding="async"/>
            </figure>
          </a>
        </section>

        <section class="bulma-column bulma-is-6-desktop bulma-is-12-tablet bulma-is-12-mobile">
          <p class="oa-sponsors__tier-label bulma-is-uppercase bulma-has-text-weight-semibold bulma-is-size-7 bulma-mb-3 bulma-has-text-left">Bronze</p>
          <div class="bulma-columns bulma-is-mobile bulma-is-variable bulma-is-2 bulma-m-0 bulma-is-justify-content-flex-start">
            <div class="bulma-column bulma-is-half">
              <a class="oa-logo-link" href="https://www.degruyterbrill.com/" target="_blank" rel="noopener" aria-label="De Gruyter Brill">
                <figure class="bulma-image oa-logo-box bulma-m-0">
                  <img src="https://doabooks.o172i.upcloudobjects.com/uploads/Picture1_c6b621805b.png" alt="De Gruyter Brill" loading="lazy" decoding="async"/>
                </figure>
              </a>
            </div>
            <div class="bulma-column bulma-is-half">
              <a class="oa-logo-link" href="https://www.mdpi.com/books/?utm_campaign=MDPIBooks_sponsorships&utm_medium=MDPIBooks_logo&utm_source=DOAB_website/" target="_blank" rel="noopener" aria-label="MDPI Books">
                <figure class="bulma-image oa-logo-box bulma-m-0">
                  <img src="https://doabooks.o172i.upcloudobjects.com/uploads/MDPI_Books_Logo_bb52c3124a.png" alt="MDPI Books" loading="lazy" decoding="async"/>
                </figure>
              </a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </section>
</th:block>
