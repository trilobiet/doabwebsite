<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Spring Boot Thymeleaf Application - Fragments</title>
</head>
<body>

<div th:fragment="header">
    <h1>Thymeleaf Fragments</h1>
</div>

<!--
	Spotlights
~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="spotlights"
          th:with="
            spotlightCount=${spotlights != null ? T(java.lang.Math).min(spotlights.size(), 3) : 0},
            spotlightItems=${spotlights != null ? spotlights.subList(0, spotlightCount) : T(java.util.Collections).emptyList()}
          ">
  <li class="bulma-column bulma-is-full-mobile bulma-is-half-tablet bulma-is-one-third-desktop bulma-is-flex"
       th:each="article : ${spotlightItems}">
    <th:block th:insert="~{home/feed_card :: card(
      title=${article.title},
      url=@{'/'+${language}+'/article/' + ${article.slug}},
      summary=${@viewhelpers.abbreviate(article.summary, 220)},
      category='Spotlight'
    )}"></th:block>
  </li>
</th:block>

<footer th:fragment="footer">
	<p>2020 trilobiet.nl</p>
</footer>

</body>
</html>
