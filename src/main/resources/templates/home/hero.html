 <!--
  Hero section (search + tagline + featured titles)
~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="hero">
  <section class="bulma-hero" role="region" aria-label="Homepage hero">
    <div class="bulma-hero-body bulma-pt-6 bulma-pb-6">
      <div class="bulma-container bulma-is-max-fullhd">

        <div class="bulma-columns bulma-is-variable bulma-is-6 bulma-is-vcentered">
          <!-- Tagline + intro -->
          <div class="bulma-column bulma-is-half-desktop bulma-is-full-tablet">
            <th:block th:insert="home/herotagline :: tagline">Tagline</th:block>
          </div>
          <!-- Search + browse tags -->
          <div class="bulma-column bulma-is-half-desktop bulma-is-full-tablet">
            <th:block th:insert="home/herosearch :: search">Search</th:block>
          </div>
        </div>

        <!-- Featured titles -->
        <div class="bulma-mt-6" role="region" aria-label="New additions" aria-live="polite">
          <header class="bulma-mb-4 oa-section-header">
            <h2 class="bulma-title bulma-is-5 bulma-pb-4 bulma-mb-0 bulma-has-text-weight-normal">New from DOAB</h2>
          </header>
          <div class="carouselloader" th:data-src="|@{'/' + ${language} + '/featuredtitles'} #FeaturedTitles|"></div>
        </div>

      </div>
    </div>
  </section>
</th:block>
