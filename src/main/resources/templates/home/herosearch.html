<!--
	Hero search + browse tags
~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="search">
  <section aria-labelledby="home-search-title"
           class="bulma-has-background-white">
    <div class="bulma-py-4">

        <h2 class="bulma-title bulma-is-3 bulma-mb-4 bulma-has-text-weight-semibold"
            id="home-search-title">
          <span th:text="#{find_open_access_books}">Find open access books:</span>
        </h2>

        <form
          th:action="${settings.dspace_site+'discover'}"
          role="search"
          aria-labelledby="home-search-title">

          <label for="ipt_search" class="bulma-is-sr-only" id="search-label">
            <span th:text="#{find_open_access_books_by_keyword}">Find open access books by keyword</span>
          </label>

          <div class="bulma-field bulma-has-addons oa-input-group">
            <p class="bulma-control bulma-is-expanded">
              <input
                id="ipt_search"
                class="bulma-input bulma-is-shadowless bulma-is-outlined"
                type="search"
                name="query"
                th:placeholder="#{search_doab}"
                placeholder="Search DOAB"
                autocomplete="off"
                required>
              <input type="hidden" name="locale-attribute" th:value="${language}">
            </p>

            <p class="bulma-control">
              <button type="submit" class="bulma-button bulma-is-shadowless">
                <span class="bulma-is-sr-only" th:text="#{search_button}">Search</span>
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
                     xmlns="http://www.w3.org/2000/svg">
                  <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                  <line x1="16.65" y1="16.65" x2="21" y2="21"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
            </p>
          </div>
        </form>

        <p class="bulma-mt-4 bulma-mb-1">
          <a class="bulma-is-size-6 bulma-has-text-weight-medium" th:href="${settings.dspace_site+'?locale-attribute='+language}">
            <span th:text="#{mnu_search}">Search</span> &rarr;
          </a>
        </p>

        <div class="bulma-mt-4" role="group" th:aria-label="#{browse_by}">
          <h3 class="bulma-is-size-6 bulma-mb-2 bulma-has-text-weight-normal" th:text="#{browse}">Browse</h3>
          <ul class="bulma-tags">
            <li><a class="bulma-tag bulma-has-background-brand bulma-has-text-ink bulma-has-text-weight-medium"
                   th:href="${settings.dspace_site+'/browse?type=classification_text&locale-attribute='+language}"
                   th:text="#{subject}">Subject</a></li>
            <li><a class="bulma-tag bulma-has-background-brand bulma-has-text-ink bulma-has-text-weight-medium"
                   th:href="${settings.dspace_site+'/browse?type=publisher&locale-attribute='+language}"
                   th:text="#{publisher}">Publisher</a></li>
            <li><a class="bulma-tag bulma-has-background-brand bulma-has-text-ink bulma-has-text-weight-medium"
                   th:href="${settings.dspace_site+'/browse?type=collection&locale-attribute='+language}"
                   th:text="#{collections}">Collections</a></li>
            <li><a class="bulma-tag bulma-has-background-brand bulma-has-text-ink bulma-has-text-weight-medium"
                   th:href="${settings.dspace_site+'/browse?type=language&locale-attribute='+language}"
                   th:text="#{language}">Language</a></li>
          </ul>
        </div>

    </div>
  </section>
</th:block>
