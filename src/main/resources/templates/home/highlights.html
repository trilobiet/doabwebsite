<!--
  Highlights
~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="highlights">
  <section class="bulma-section bulma-py-6 bulma-has-background-tropic-amber-pastel bulma-has-text-ink"
           th:if="${highlights != null and !#lists.isEmpty(highlights)}">
    <div class="bulma-container bulma-py-6">
      <article th:each="article, stat : ${highlights}">
        <div class="bulma-columns bulma-is-variable bulma-is-6">
          <div class="bulma-column bulma-is-4-desktop bulma-is-5-tablet">
            <h2 class="bulma-title bulma-is-3 bulma-mb-0 bulma-has-text-weight-normal">
              <a class="bulma-has-text-current"
                 th:href="@{'/'+${language}+'/article/' + ${article.slug}}"
                 th:text="${article.title}">
                Highlight title
              </a>
            </h2>
          </div>

          <div class="bulma-column bulma-is-8-desktop bulma-is-7-tablet">
            <div class="bulma-content bulma-is-size-5 bulma-mb-0">
              <th:block th:utext="${article.summary}">
                Highlight summary
              </th:block>
            </div>
            <p class="bulma-mt-4">
              <a class="bulma-button bulma-is-outlined bulma-is-shadowless bulma-has-text-ink"
                 style="border-color: currentColor;"
                 th:href="@{'/'+${language}+'/article/' + ${article.slug}}">
                See more
              </a>
            </p>
          </div>
        </div>
        <hr class="bulma-my-6" th:if="${!stat.last}">
      </article>
    </div>
  </section>

  <section class="bulma-section bulma-py-6 bulma-has-background-tropic-amber-pastel bulma-has-text-ink"
           th:if="${highlights == null or #lists.isEmpty(highlights)}">
    <div class="bulma-container bulma-py-6">
      <article>
        <div class="bulma-columns bulma-is-variable bulma-is-6">
          <div class="bulma-column bulma-is-4-desktop bulma-is-5-tablet">
            <h2 class="bulma-title bulma-is-3 bulma-mb-0 bulma-has-text-weight-normal">
              <a class="bulma-has-text-current" href="#">
                Building Better Metadata Workflows
              </a>
            </h2>
          </div>

          <div class="bulma-column bulma-is-8-desktop bulma-is-7-tablet">
            <div class="bulma-content bulma-is-size-5 bulma-mb-0">
              Temporary highlight content for layout testing until CMS highlights are available.
            </div>
            <p class="bulma-mt-4">
              <a class="bulma-button bulma-is-outlined bulma-is-shadowless bulma-has-text-ink"
                 style="border-color: currentColor;"
                 href="#">
                See more
              </a>
            </p>
          </div>
        </div>
        <hr class="bulma-my-6">
      </article>

      <article>
        <div class="bulma-columns bulma-is-variable bulma-is-6">
          <div class="bulma-column bulma-is-4-desktop bulma-is-5-tablet">
            <h2 class="bulma-title bulma-is-3 bulma-mb-0 bulma-has-text-weight-normal">
              <a class="bulma-has-text-current" href="#">
                Open Access Policy Updates
              </a>
            </h2>
          </div>

          <div class="bulma-column bulma-is-8-desktop bulma-is-7-tablet">
            <div class="bulma-content bulma-is-size-5 bulma-mb-0">
              Second placeholder item to validate spacing, hierarchy, and responsive behavior.
            </div>
            <p class="bulma-mt-4">
              <a class="bulma-button bulma-is-outlined bulma-is-shadowless bulma-has-text-ink"
                 style="border-color: currentColor;"
                 href="#">
                See more
              </a>
            </p>
          </div>
        </div>
      </article>
    </div>
  </section>

</th:block>
