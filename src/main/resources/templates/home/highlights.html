<!--
  Highlights
~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
<th:block th:fragment="highlights">
  <section class="bulma-section bulma-py-5 bulma-has-background-tropic-amber-pastel bulma-has-text-ink"
           th:if="${highlights != null and !#lists.isEmpty(highlights)}">
    <div class="bulma-container">
      <header class="bulma-has-text-centered bulma-mb-5">
        <h2 class="bulma-title bulma-is-2 bulma-mb-5 bulma-has-text-weight-bold">
          Highlights
        </h2>
        <p class="bulma-is-block bulma-is-size-5 bulma-mb-2 bulma-has-text-weight-normal">
          Featured stories from DOAB.
        </p>
      </header>

      <ul class="bulma-columns bulma-is-multiline bulma-is-variable bulma-is-5" role="list">
        <li class="bulma-column bulma-is-half-desktop bulma-is-full-tablet"
            th:each="article : ${highlights}"
            role="listitem">
          <article class="bulma-content">
            <h3 class="bulma-title bulma-is-4 bulma-mb-3 bulma-has-text-weight-normal">
              <a class="bulma-has-text-current"
                 th:href="@{'/'+${language}+'/article/' + ${article.slug}}"
                 th:text="${article.title}">
                Highlight title
              </a>
            </h3>

            <div class="bulma-is-size-5">
              <th:block th:utext="${article.summary}">
                Highlight summary
              </th:block>
            </div>

            <figure class="bulma-image bulma-mt-4"
                    th:if="${not #lists.isEmpty(article.media)}"
                    th:each="media : ${@viewhelpers.images(article.media)}">
              <img th:src="${media.url}"
                   th:alt="${article.title}"
                   loading="lazy"
                   decoding="async" />
            </figure>
          </article>
        </li>
      </ul>
    </div>
  </section>

</th:block>
