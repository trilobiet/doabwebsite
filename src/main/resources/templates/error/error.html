<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DOAB Error</title>
  <link rel="stylesheet" th:href="@{/static-assets/css/main.min.css}"/>
  <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
</head>

<!-- Standalone template: avoid dependency on normal site layout for error handling -->
<body class="bulma-has-background-paper">
  <main class="bulma-section bulma-py-6" style="min-height:100vh;">
    <div class="bulma-container">
      <div class="bulma-columns bulma-is-centered">
        <div class="bulma-column bulma-is-8-desktop bulma-is-10-tablet">
          <article class="bulma-box bulma-p-5 bulma-p-6-desktop">
            <p class="bulma-mb-5">
              <a th:href="@{'/'}" th:aria-label="#{doab_homepage}">
                <th:block th:replace="~{include/logotype :: logo(220, 0, 'oa-logo-svg')}"></th:block>
              </a>
            </p>

            <div class="bulma-content" layout:fragment="content">
              Error content
            </div>

            <p class="bulma-mt-5">
              <a th:href="@{/}" class="bulma-button bulma-is-outlined bulma-is-shadowless bulma-has-text-ink" style="border-color: currentColor;">
                <span th:text="#{back_to_homepage}">Back to homepage</span>
              </a>
            </p>
          </article>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
